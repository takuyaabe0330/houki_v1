<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法規・制度・倫理 演習クイズ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-slate-800 tracking-tight">法規・制度・倫理 徹底演習クイズ</h1>
      <span id="total-count-badge" class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-full border border-indigo-200">
        全100問収録
      </span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8">

      <!-- スタート画面 -->
      <div id="start-screen" class="text-center space-y-6">
        <div>
          <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2">法規・制度・倫理 クイズ</h2>
          <p class="text-slate-500 text-sm">薬剤師国家試験対応 5択演習（厳選100問）</p>
        </div>

        <div class="bg-indigo-50/60 rounded-xl p-4 border border-indigo-100 text-left space-y-2">
          <p class="text-xs font-bold text-indigo-900 uppercase tracking-wider">出題ルール</p>
          <ul class="text-xs text-indigo-700 list-disc list-inside space-y-1">
            <li>1回につきランダムで <strong>10問</strong> 出題されます。</li>
            <li>「次回から出題しない」に登録した問題は、<strong>リセットするまで完全に除外</strong>されます。</li>
          </ul>
        </div>

        <div class="text-left space-y-1">
          <label for="cat-select" class="block text-xs font-bold text-slate-600">出題カテゴリの選択</label>
          <select id="cat-select" onchange="updateStartScreenInfo()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="all">すべてのカテゴリ（全100問 ランダム）</option>
            <option value="薬剤師法・医療倫理">薬剤師法・医療倫理（問1〜20）</option>
            <option value="薬機法（定義・区分・表示）">薬機法：定義・区分・表示（問21〜40）</option>
            <option value="薬局・医薬品等販売業・製造販売業">薬局・医薬品等販売業・製造販売業（問41〜60）</option>
            <option value="麻薬・向精神薬・覚醒剤・毒劇法">特別な管理を要する薬物：麻向・覚醒剤・毒劇（問61〜80）</option>
            <option value="医療法・社会保障・副作用救済制度">医療法・社会保障・副作用救済制度（問81〜100）</option>
          </select>
        </div>

        <div class="flex justify-between items-center bg-slate-50 rounded-xl p-3 border border-slate-200 text-xs text-slate-600">
          <span id="high-score-display" class="font-bold">ベストスコア: -</span>
          <span id="excluded-count-display" class="font-medium text-slate-500">除外中の問題: 0問</span>
        </div>

        <div class="space-y-3">
          <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition duration-200 text-base">
            クイズを開始する
          </button>
          <button onclick="resetExcludedQuestions()" class="w-full bg-white hover:bg-slate-50 text-slate-500 border border-slate-200 font-semibold py-2 px-4 rounded-xl text-xs transition">
            🔄 このカテゴリの除外履歴をリセット（全問復活）
          </button>
        </div>
      </div>

      <!-- クイズ画面 -->
      <div id="quiz-screen" class="hidden space-y-6">
        <div class="flex justify-between items-center text-xs font-bold text-slate-400 border-b border-slate-100 pb-3">
          <span id="quiz-category" class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">カテゴリ</span>
          <span id="quiz-progress">問 1 / 10</span>
        </div>

        <div>
          <h3 id="question-text" class="text-lg md:text-xl font-bold text-slate-900 leading-relaxed min-h-[4rem]">
            問題文
          </h3>
        </div>

        <div id="options-container" class="space-y-2.5"></div>

        <!-- 回答後の解説エリア -->
        <div id="explanation-container" class="hidden bg-slate-50 rounded-xl p-5 border border-slate-200 space-y-3">
          <div id="answer-status" class="font-bold text-base"></div>
          <p id="explanation-text" class="text-xs md:text-sm text-slate-600 leading-relaxed"></p>

          <div class="pt-2 border-t border-slate-200 flex flex-col gap-2">
            <button id="exclude-btn" onclick="toggleExcludeCurrentQuestion()" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 font-semibold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1.5 transition">
              <span>🚫 この問題を習得済みにする（リセットまで次回以降出さない）</span>
            </button>
            <button id="next-btn" onclick="nextQuestion()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-4 rounded-lg text-sm transition">
              次の問題へ
            </button>
          </div>
        </div>
      </div>

      <!-- 結果画面 -->
      <div id="result-screen" class="hidden text-center space-y-6">
        <div class="space-y-2">
          <div id="result-badge" class="inline-block p-3 rounded-full bg-yellow-100 text-3xl">🏆</div>
          <h2 class="text-2xl font-bold text-slate-900">演習完了！</h2>
          <p id="result-message" class="text-sm text-slate-500"></p>
        </div>

        <div class="bg-slate-50 rounded-xl p-6 border border-slate-100">
          <div class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">今回のスコア</div>
          <div class="text-5xl font-black text-indigo-600" id="final-score">0</div>
          <div class="text-xs text-slate-400 mt-1">/ 10 点満点</div>
        </div>

        <div class="flex gap-3">
          <button onclick="startQuiz()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition">
            もう一度解く
          </button>
          <button onclick="backToTop()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl text-sm transition">
            トップに戻る
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-400">
    &copy; 法規・制度・倫理 演習アプリ - 国家試験100問対策
  </footer>

  <script>
    const allQuizData = [
  {
    "id": 1,
    "category": "薬剤師法・医療倫理",
    "question": "薬剤師法第1条（薬剤師の任務）に関する規定として、条文中の（　）に入る語句の組み合わせとして正しいものはどれか。\n「薬剤師は、（ A ）をつかさどることによつて、国民の薬物療法を確保し、もつて（ B ）の向上及び増進に寄与し、もつて国民の健康な生活を確保するものとする。」",
    "options": [
      "A: 医薬品の調剤　B: 公衆衛生",
      "A: 調剤、医薬品の供給その他薬事衛生　B: 国民の健康",
      "A: 調剤、医薬品の供給その他薬事衛生　B: 公衆衛生",
      "A: 医薬品の適正使用及び安全管理　B: 公衆衛生",
      "A: 医薬品の調剤及び服薬指導　B: 医療安全"
    ],
    "answerIndex": 2,
    "explanation": "薬剤師法第1条では、「薬剤師は、調剤、医薬品の供給その他薬事衛生をつかさどることによつて、公衆衛生の向上及び増進に寄与し、もつて国民の健康な生活を確保するものとする。」と規定されています。"
  },
  {
    "id": 2,
    "category": "薬剤師法・医療倫理",
    "question": "薬剤師免許の付与および名簿登録に関する記述のうち、正しいものはどれか。",
    "options": [
      "薬剤師免許は、薬剤師国家試験に合格した者に対し、都道府県知事が与える。",
      "薬剤師免許は、薬剤師名簿に登録されることによってその効力を生じる。",
      "薬剤師国家試験に合格した時点で、名簿登録前であっても調剤業務を行うことができる。",
      "薬剤師名簿は、各都道府県庁に備えられ、知事が管理する。",
      "免許証の再交付を受けた後、亡失した免許証を発見したときは、30日以内に返納しなければならない。"
    ],
    "answerIndex": 1,
    "explanation": "薬剤師法第6条により、薬剤師免許は薬剤師名簿に登録されることによって効力を生じます。免許を与えるのは厚生労働大臣であり、名簿も厚生労働省に備えられています。なお亡失した免許証を発見したときは「5日以内」に返納します。"
  },
  {
    "id": 3,
    "category": "薬剤師法・医療倫理",
    "question": "薬剤師法第8条に規定される「薬剤師の届出」に関する記述のうち、正しいものはどれか。",
    "options": [
      "薬剤師は、毎年12月31日現在の氏名、住所等を厚生労働大臣に届け出なければならない。",
      "薬剤師は、2年ごとの12月31日現在の氏名、住所等を、翌年1月15日までに届け出なければならない。",
      "薬剤師は、2年ごとの12月31日現在の氏名、住所等を、翌年1月16日までに届け出なければならない。",
      "薬局または医療機関に従事していない薬剤師は、この届出を行う必要はない。",

    "answerIndex": 2,

  },
  {
    "id": 4,
    "category": "薬剤師法・医療倫理",
    "question": "薬剤師法第19条（調剤）に関する記述のうち、正しいものはどれか。",
    "options": [
      "薬剤師でなければ、販売又は授与の目的で調剤してはならない。",

    "answerIndex": 0,

  },
  {
    "id": 5,
    "category": "薬剤師法・医療倫理",
    "question": "薬剤師法第21条（調剤の求めに応ずる義務／調剤応需義務）に関する記述のうち、正しいものはどれか。",
    "options": [
      "薬局に従事する薬剤師のみならず、製薬企業に従事する薬剤師も調剤の求めに応じる義務がある。",
      "調剤に従事する薬剤師は、調剤の求めがあった場合には、正当な理由がなければこれを拒んではならない。",
      "処方された医薬品の備蓄がないことは、いかなる場合も調剤を拒否する「正当な理由」となる。",
      "患者の態度が非協力的であることを理由に、即座に調剤を拒否することができる。",

    "explanation": "薬剤師法第21条において「調剤に従事する薬剤師は、調剤の求めがあつた場合には、正当な理由がなければ、これを拒んではならない」と規定されています。医薬品の備蓄がない場合でも、近隣薬局への照会・手配等の対応が求められ、単に在庫がないことのみで即座に拒むことは正当な理由と認められない場合があります。"
  },
  {
    "id": 6,
    "category": "薬剤師法・医療倫理",
    "question": "薬剤師法第22条（薬局以外の場所での調剤の禁止）の例外として、薬局以外の場所で調剤できる場合に該当しないものはどれか。",
    "options": [
      "医師又は歯科医師の求めに応じ、その診療所内において調剤する場合",
      "災害救助法が適用される災害時において、避難所等の現場で調剤する場合",
      "患者の居宅等において調剤を行うことが患者の医療を受ける利益のために必要であると認められる場合",
      "製薬企業の研究所内において、新薬の臨床試験用製剤を調剤する場合",
      "船舶内において、乗組員の急病に対応するために船医の指示で調剤する場合"
    ],
    "answerIndex": 3,
    "explanation": "薬機法・薬剤師法上、調剤は原則として薬局内で行わなければなりませんが、例外として医師・歯科医師の求めに応じ病院・診療所内で行う場合、災害時、在宅医療において患者居宅で行うことが必要な場合、船舶内などが政令・通知で定められています。治験薬の製造・調製等はこれに該当しません。"
  },
  {
    "id": 7,
    "category": "薬剤師法・医療倫理",
    "question": "薬剤師法第23条（処方箋による調剤）に関する記述のうち、正しいものはどれか。",
    "options": [
      "薬剤師は、医師、歯科医師又は獣医師の処方箋によらなければ、販売又は授与の目的で調剤してはならない。",

    "options": [

      "薬剤師は、処方箋中に疑わしい点があるときは、その処方箋を交付した医師等に連絡して疑義を確かめた後でなければ、調剤してはならない。",

    const QUESTION_COUNT = 10;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getExcludedStorageKey() {
      return 'quiz_law_permanently_excluded_ids';
    }

    function getExcludedIds() {
      const key = getExcludedStorageKey();
      return JSON.parse(localStorage.getItem(key) || '[]');
    }

    function saveExcludedIds(ids) {
      const key = getExcludedStorageKey();
      localStorage.setItem(key, JSON.stringify(ids));
    }

    window.onload = () => {
      document.getElementById('total-count-badge').innerText = `全 ${allQuizData.length} 問収録`;
      updateStartScreenInfo();
    };

    function updateStartScreenInfo() {
      const selectedCat = document.getElementById('cat-select').value;
      const scoreKey = `quizLawHighScore_${selectedCat}`;
      const highScore = localStorage.getItem(scoreKey) || 0;
      document.getElementById('high-score-display').innerText = `ベスト: ${highScore} / ${QUESTION_COUNT} 点`;

      const excludedIds = getExcludedIds();
      let pool = allQuizData;
      if (selectedCat !== 'all') {
        pool = allQuizData.filter(q => q.category === selectedCat);
      }
      const excludedInCat = pool.filter(q => excludedIds.includes(q.id)).length;
      document.getElementById('excluded-count-display').innerText = `習得済み(除外): ${excludedInCat} / ${pool.length} 問`;
    }

    function resetExcludedQuestions() {
      const selectedCat = document.getElementById('cat-select').value;
      if (!confirm('除外（習得済み）設定をリセットし、すべての問題を出題対象に戻しますか？')) {
        return;
      }

      let excludedIds = getExcludedIds();
      if (selectedCat === 'all') {
        localStorage.removeItem(getExcludedStorageKey());
      } else {
        const poolIds = allQuizData.filter(q => q.category === selectedCat).map(q => q.id);
        excludedIds = excludedIds.filter(id => !poolIds.includes(id));
        saveExcludedIds(excludedIds);
      }
      updateStartScreenInfo();
      alert('リセットが完了しました。すべての問題が再び出題されます。');
    }

    function startQuiz() {
      const selectedCat = document.getElementById('cat-select').value;
      let pool = allQuizData;
      if (selectedCat !== 'all') {
        pool = allQuizData.filter(q => q.category === selectedCat);
      }

      const excludedIds = getExcludedIds();
      let availablePool = pool.filter(q => !excludedIds.includes(q.id));

      if (availablePool.length === 0) {
        alert('このカテゴリのすべての問題を習得済み（除外）に設定しています！\n「除外履歴をリセット」を押して再挑戦してください。');
        return;
      }

      const count = Math.min(QUESTION_COUNT, availablePool.length);
      currentQuestions = shuffleArray(availablePool).slice(0, count);

      currentQuestionIndex = 0;
      score = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      showQuestion();
    }

    function showQuestion() {
      isAnswered = false;
      const q = currentQuestions[currentQuestionIndex];

      document.getElementById('quiz-category').innerText = q.category;
      document.getElementById('quiz-progress').innerText = `問 ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
      document.getElementById('question-text').innerText = q.question;

      const excludeBtn = document.getElementById('exclude-btn');
      const excludedIds = getExcludedIds();
      if (excludedIds.includes(q.id)) {
        excludeBtn.className = "w-full bg-emerald-50 text-emerald-800 border border-emerald-300 font-semibold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1.5 transition";
        excludeBtn.innerHTML = '<span>✅ 習得済み（次回から出題されません - クリックで解除）</span>';
      } else {
        excludeBtn.className = "w-full bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 font-semibold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1.5 transition";
        excludeBtn.innerHTML = '<span>🚫 この問題を習得済みにする（リセットまで次回以降出さない）</span>';
      }

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition text-sm font-medium text-slate-700 flex items-start gap-3";
        btn.innerHTML = `<span class="inline-block w-5 text-slate-400 font-bold">${idx + 1}.</span> <span>${opt}</span>`;
        btn.onclick = () => selectAnswer(idx);
        container.appendChild(btn);
      });

      document.getElementById('explanation-container').classList.add('hidden');
    }

    function toggleExcludeCurrentQuestion() {
      const q = currentQuestions[currentQuestionIndex];
      let excludedIds = getExcludedIds();
      const excludeBtn = document.getElementById('exclude-btn');

      if (excludedIds.includes(q.id)) {
        excludedIds = excludedIds.filter(id => id !== q.id);
        saveExcludedIds(excludedIds);
        excludeBtn.className = "w-full bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 font-semibold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1.5 transition";
        excludeBtn.innerHTML = '<span>🚫 この問題を習得済みにする（リセットまで次回以降出さない）</span>';
      } else {
        excludedIds.push(q.id);
        saveExcludedIds(excludedIds);
        excludeBtn.className = "w-full bg-emerald-50 text-emerald-800 border border-emerald-300 font-semibold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1.5 transition";
        excludeBtn.innerHTML = '<span>✅ 習得済み（次回から出題されません - クリックで解除）</span>';
      }
    }

    function selectAnswer(selectedIdx) {
      if (isAnswered) return;
      isAnswered = true;

      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.getElementById('options-container').querySelectorAll('button');
      const isCorrect = (selectedIdx === q.answerIndex);

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answerIndex) {
          btn.className = "w-full text-left p-3.5 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold text-sm flex items-start gap-3";
        } else if (idx === selectedIdx) {
          btn.className = "w-full text-left p-3.5 rounded-xl border border-rose-400 bg-rose-50 text-rose-800 text-sm flex items-start gap-3";
        } else {
          btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-100 bg-slate-50 text-slate-400 text-sm flex items-start gap-3";
        }
      });

      const status = document.getElementById('answer-status');
      if (isCorrect) {
        score++;
        status.innerHTML = '<span class="text-emerald-600">◎ 正解！</span>';
      } else {
        status.innerHTML = `<span class="text-rose-600">✕ 不正解...</span> <span class="text-xs text-slate-500 font-normal">（正解: ${q.options[q.answerIndex]}）</span>`;
      }

      document.getElementById('explanation-text').innerText = q.explanation;
      document.getElementById('explanation-container').classList.remove('hidden');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').innerText = score;

      const selectedCat = document.getElementById('cat-select').value;
      const scoreKey = `quizLawHighScore_${selectedCat}`;
      const currentHigh = parseInt(localStorage.getItem(scoreKey) || '0', 10);
      if (score > currentHigh) {
        localStorage.setItem(scoreKey, score);
      }

      const badge = document.getElementById('result-badge');
      const msg = document.getElementById('result-message');

      if (score === currentQuestions.length && score >= 10) {
        badge.innerText = '🎉';
        msg.innerText = '全問正解！法規の要点は完璧に身についています！';
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      } else if (score >= 7) {
        badge.innerText = '✨';
        msg.innerText = '合格圏内です！習得済みの問題を増やしていきましょう。';
      } else {
        badge.innerText = '📚';
        msg.innerText = '間違えた数字や根拠条文をしっかり復習して再挑戦しましょう！';
      }
    }

    function backToTop() {
      updateStartScreenInfo();
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
